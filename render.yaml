services:
  - type: web
    name: sop-insurance-agent
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DEMO_TODAY
        value: "2026-03-05"
      - key: TRUST_PROXY
        value: "true"
